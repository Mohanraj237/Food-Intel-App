name: family-food-intelligence

services:

  postgres:
    image: postgres:16-alpine
    container_name: ffi-postgres
    environment:
      POSTGRES_DB: familyfood
      POSTGRES_USER: familyfood
      # Local development only. Never reused in a deployed environment.
      POSTGRES_PASSWORD: familyfood_local
      # Deterministic collation so search ranking is reproducible across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyfood -d familyfood"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage for label images. Bucket contents are private;
  # retrieval is always through a short-lived signed URL, never a public path.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ffi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: creates both buckets the app expects (platform.storage.ObjectStorageClient /
  # AppProperties.Storage) and sets the access level each one's data actually needs.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: ffi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/familyfood-labels &&
      mc anonymous set none local/familyfood-labels &&
      mc mb --ignore-existing local/familyfood-catalogue-images &&
      mc anonymous set download local/familyfood-catalogue-images &&
      echo 'buckets ready (labels: private, catalogue-images: public-read)'
      "

volumes:
  postgres-data:
  minio-data:
