<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C2410C" />
    <meta name="description" content="Know whether a packaged food fits the people you shop for — with the reason and the source for every result." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/PlusJakartaSans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Family Food Intelligence</title>
    <script>
      // Applies a previously chosen dark theme / text size before first paint, so there is
      // no light-then-dark flash. Light is the default for everyone who has never touched
      // the Appearance toggle — this never reads the OS preference (see src/lib/theme.ts).
      (function () {
        try {
          if (localStorage.getItem('ffi-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
          if (localStorage.getItem('ffi-text-size') === 'large') {
            document.documentElement.setAttribute('data-text-size', 'large');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
