spring:
  application:
    name: family-food-intelligence

  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/familyfood}
    username: ${DB_USERNAME:familyfood}
    password: ${DB_PASSWORD:}
    hikari:
      # The pool, not the thread count, bounds database concurrency. With virtual threads a
      # burst no longer waits for a request thread; it waits here, for up to connection-timeout.
      # Size this to what Postgres can serve (instances x pool < max_connections, with headroom),
      # never to the number of concurrent requests.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 10000
      leak-detection-threshold: 30000

  jpa:
    open-in-view: false          # an open session in a view layer hides N+1 queries
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only verifies it
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        query.in_clause_parameter_padding: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true   # reject unexpected input rather than ignoring it

  threads:
    virtual:
      enabled: true

  # Used only when familyfood.cache.type=redis (D-056); nothing connects otherwise.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      # The longest one request waits on an unresponsive Redis, per operation, before falling
      # back to the database; the circuit breaker then skips Redis for everyone else. Lettuce
      # also applies it to a new connection's handshake, which a cold JVM can make slow.
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false          # Redis is a cache here, never a store

server:
  port: ${SERVER_PORT:8090}
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never          # health detail can disclose infrastructure topology
      status:
        # DEGRADED: the shared cache is unreachable and reads go to the database (D-056). It
        # maps to HTTP 200. No http-mapping here on purpose: setting one replaces the defaults,
        # and DOWN would stop returning 503.
        order: down, out-of-service, degraded, up, unknown
  health:
    redis:
      enabled: false               # reports DOWN for an optional cache; CacheConfig adds "cache" instead
  metrics:
    tags:
      application: family-food-intelligence

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

familyfood:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  # D-056. caffeine: in-process, right for one instance. redis: shared by every instance
  # (also set REDIS_*). none: caching off. Only public catalogue data is ever cached.
  cache:
    type: ${CACHE_TYPE:caffeine}
    key-prefix: "ffi:"
    retry-after: PT30S         # after a cache failure, skip the cache this long before retrying

  auth:
    # No default. Startup fails without it — a guessable signing key is worse than a crash.
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${JWT_ISSUER:family-food-intelligence}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    # OWASP Argon2id floor: 19 MiB, t=2, p=1
    argon2-salt-length: 16
    argon2-hash-length: 32
    argon2-parallelism: 1
    argon2-memory-kb: 19456
    argon2-iterations: 2

  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:ap-south-1}
    bucket: ${STORAGE_BUCKET:familyfood-labels}
    # Catalogue images (public, non-personal) live in their own bucket — never
    # familyfood-labels, which stays scoped to private, retention-bound label photos.
    catalogue-bucket: ${STORAGE_CATALOGUE_BUCKET:familyfood-catalogue-images}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style-access: ${STORAGE_PATH_STYLE:true}
    signed-url-ttl: PT10M

  ai:
    # false is a fully supported production state: OCR degrades to manual entry and
    # explanations degrade to deterministic templates (D-011, Constitution §75).
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:none}
    api-key: ${AI_API_KEY:}
    ocr-model: ${AI_OCR_MODEL:}
    explanation-model: ${AI_EXPLANATION_MODEL:}
    timeout: PT20S
    max-retries: 1

  # D-059. On start, if the ACTIVE rule set has score components but no product has been
  # scored yet (the first boot after a rule set is activated by migration), run one
  # background rescore so search and lists have scores without waiting for page views.
  scoring:
    rescore-on-startup: ${SCORING_RESCORE_ON_STARTUP:true}

  limits:
    login-attempts-per-hour: 10
    signups-per-hour-per-ip: 5
    searches-per-minute: 60
    uploads-per-hour: 30
    ai-calls-per-hour: 100
    max-image-bytes: 8388608
    allowed-image-content-types:
      - image/jpeg
      - image/png
      - image/webp

  privacy:
    label-image-retention: P90D
    ocr-raw-text-retention: P30D
    login-attempt-retention: P1D
    erasure-grace-period: P30D
    hash-pepper: ${PRIVACY_HASH_PEPPER}

logging:
  level:
    root: INFO
    com.familyfood: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
