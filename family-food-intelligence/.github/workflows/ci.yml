name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values. Never reused anywhere deployed — see .env.example.
  JWT_SECRET: dGVzdC1zaWduaW5nLWtleS1ub3QtYS1zZWNyZXQtdGhpcnR5LXR3by1i
  PRIVACY_HASH_PEPPER: ci-pepper-not-a-secret

jobs:
  # ---------------------------------------------------------------------------
  # Runs first and independently: a leaked credential must be caught before any
  # other job has a chance to echo it into a log.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if a .env file is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. Only .env.example may be committed."
            exit 1
          fi
          echo "No tracked .env"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile
        working-directory: backend
        run: mvn -B -ntp compile

      # Unit tests need no Docker: they cover the rules engine, the masking layer
      # and the architecture boundaries, and must stay fast enough to run on every
      # save locally.
      - name: Unit tests and architecture rules
        working-directory: backend
        run: mvn -B -ntp test

      # Integration tests run against a real PostgreSQL via Testcontainers.
      # H2 would not exercise pg_trgm, partial unique indexes or the audit-log
      # trigger, so a green H2 suite would prove nothing about production.
      - name: Integration tests
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Package
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # Includes the banned-vocabulary gate. A build that ships copy telling a
      # user a food is "toxic", or that diagnoses them, fails here rather than in
      # front of a person (D-004, AC-9.5).
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
